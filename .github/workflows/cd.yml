# 백엔드 CD: main 푸시 시 이미지를 GHCR에 올리고, EC2에서 deploy/docker-compose.prod.yml(백엔드 + MySQL)로 교체한다.
# 필요한 GitHub Secrets: SERVER_HOST, SERVER_USERNAME, SERVER_SSH_PORT, SERVER_KEY (프론트 CD와 같은 서버 접속 정보),
#                        GHCR_READ_TOKEN (서버에서 이미지를 받을 read:packages 토큰)
# 서버 준비: deploy/README.md (Docker·스왑·IAM 역할, /home/ubuntu/durooduroo/.env 는 deploy/.env.production.example 참고).
name: Backend CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dandimate-2026/dandimate-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew --no-daemon test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/mysql/low-memory.cnf,deploy/backup-mysql.sh,deploy/restore-mysql.sh"
          target: /home/ubuntu/durooduroo
          strip_components: 1
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            cd /home/ubuntu/durooduroo
            chmod +x backup-mysql.sh restore-mysql.sh
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export BACKEND_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull backend
            # 예전 CD가 docker run으로 띄운 컨테이너가 있으면 지운다(이름이 같다). DB 데이터는 볼륨에 있어 지워지지 않는다.
            if [ "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' durooduroo-backend 2>/dev/null)" != "durooduroo" ]; then docker rm -f durooduroo-backend 2>/dev/null || true; fi
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            for i in $(seq 1 45); do curl -fs http://127.0.0.1:8080/api/v1/health && exit 0; sleep 2; done
            docker compose -f docker-compose.prod.yml logs --tail 100 backend; exit 1
