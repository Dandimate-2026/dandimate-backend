# 백엔드 CD: main 푸시 시 이미지를 GHCR에 올리고 EC2에서 교체한다.
# 필요한 GitHub Secrets: SERVER_HOST, SERVER_USERNAME, SERVER_SSH_PORT, SERVER_KEY (프론트 CD와 같은 서버 접속 정보),
#                        GHCR_READ_TOKEN (서버에서 이미지를 받을 read:packages 토큰)
# 서버 준비: Docker 설치, /home/ubuntu/durooduroo/.env 에 운영 환경변수(README "운영 배포").
name: Backend CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dandimate-2026/dandimate-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew --no-daemon test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f durooduroo-backend 2>/dev/null || true
            docker run -d --name durooduroo-backend --restart unless-stopped \
              --env-file /home/ubuntu/durooduroo/.env -p 127.0.0.1:8080:8080 \
              ${{ env.IMAGE }}:${{ github.sha }}
            for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/v1/health && exit 0; sleep 2; done
            docker logs --tail 100 durooduroo-backend; exit 1
