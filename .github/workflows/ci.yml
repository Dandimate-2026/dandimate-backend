# 백엔드 CI: PR과 main 푸시마다 전체 테스트(H2 메모리 DB, 가짜 STT, 규칙 기반 AI)와 MySQL 8.4 스키마 검사를 돌린다.
name: Backend CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew --no-daemon test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  # 운영과 같은 MySQL 8.4에서 Flyway(db/migration)로 테이블을 만들고 Hibernate validate가 통과하는지 본다.
  # 엔티티를 바꾸고 V{n}__*.sql을 추가하지 않으면 여기서 실패한다.
  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: durooduroo
          MYSQL_USER: duroo
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build jar
        run: ./gradlew --no-daemon bootJar -x test
      - name: Start on MySQL 8.4 with Flyway
        env:
          SPRING_PROFILES_ACTIVE: mysql
          MYSQL_URL: jdbc:mysql://127.0.0.1:3306/durooduroo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          MYSQL_USERNAME: duroo
          MYSQL_PASSWORD: ci-password
          STT_PROVIDER: fake
          MEDIA_SIGNING_SECRET: ci-signing-secret-0123456789abcdef
        run: |
          java -jar build/libs/durooduroo-backend-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/api/v1/health && exit 0; sleep 2; done
          cat app.log; exit 1
