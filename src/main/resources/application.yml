spring:
  application:
    name: durooduroo-backend
  profiles:
    default: local
  servlet:
    multipart:
      # 사진 2MB·음성 10MB 제한은 각 API가 검사하고, 여기서는 가장 큰 음성 기준으로 받는다.
      max-file-size: 10MB
      max-request-size: 11MB
  # 사진·AI 작업 Worker와 마감·SSE 유지 신호가 서로 기다리지 않게 예약 작업 스레드를 나눈다.
  task:
    scheduling:
      pool:
        size: 4
  # 테이블 변경 이력은 mysql 프로필에서만 쓴다 (application-mysql.yml). local(H2)은 엔티티로 테이블을 만든다.
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    session:
      # 모임은 며칠에 걸쳐 이어지므로 로그인을 7일 유지한다. 세션은 서버 메모리에 있어 재배포하면 다시 로그인한다.
      timeout: 7d
      cookie:
        max-age: 7d
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  port: 8080
  # nginx 뒤에서 eventsUrl 같은 절대 URL이 https·실제 호스트로 만들어지도록 X-Forwarded-* 헤더를 따른다.
  forward-headers-strategy: framework

app:
  consent:
    # 이 값을 올리면 기존 로그인 사용자는 다음 방 생성·입장 때 최신 버전 동의를 다시 해야 한다.
    current-version: ${CONSENT_VERSION:v1}
  embedding:
    initial-delay-ms: 60000
    poll-ms: 10000
  chat:
    similarity-threshold: 0.25
  push:
    # 웹 푸시를 보낼 때 쓰는 VAPID 공개키. 비우면 구독 API는 동작하되 브라우저 권한 요청은 하지 않는다.
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}
  # API 문서(/swagger-ui.html, /openapi/public-api.yaml) 공개 여부
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
  jobs:
    # Worker가 QUEUED 작업을 찾는 주기
    poll-interval-ms: 1000
    # 실패 시 즉시 1회, 이 시간 뒤 1회 재시도한다 (FR-E7)
    retry-delay-ms: 5000
    # 이 시간 동안 갱신 없는 RUNNING 작업은 QUEUED로 되돌린다
    stale-after-ms: 300000
    stale-check-interval-ms: 60000
    # 마감 시각이 지난 방을 찾는 주기
    deadline-check-interval-ms: 60000
  photos:
    # HEIC complete가 JPEG 파생본을 기다리는 최대 시간. 지나면 PROCESSING으로 응답한다.
    derive-wait-ms: 15000
  media:
    # 로컬 저장소 사진 URL 서명 키. 비우면 시작할 때마다 새로 만든다 (운영은 MEDIA_SIGNING_SECRET로 고정).
    signing-secret: ${MEDIA_SIGNING_SECRET:}
    url-ttl-seconds: 3600
  ai:
    # rule(기본, 규칙 기반 임시 구현) 또는 openai(OPENAI_API_KEY와 OPENAI_TEXT_MODEL 필요)
    provider: ${AI_PROVIDER:rule}
    # openai일 때 장면 카드에 사진(JPEG·PNG, HEIC는 파생본)을 함께 보낸다. 끄면 원문만 보낸다.
    send-photos: ${AI_SEND_PHOTOS:true}
  stt:
    # openai(기본, OPENAI_API_KEY 필요) 또는 fake(키 없이 개발·데모할 때 고정 문장을 돌려준다)
    provider: ${STT_PROVIDER:openai}
  audio:
    # 음성 길이 측정용. 없으면 MP4/M4A/WAV만 직접 잰다 (webm은 운영 서버에 ffprobe 설치 권장)
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
