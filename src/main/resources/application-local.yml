spring:
  datasource:
    url: jdbc:h2:mem:durooduroo;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

openai:
  api-key: ${OPENAI_API_KEY:}
  stt-model: ${OPENAI_STT_MODEL:gpt-transcribe}

storage:
  type: local
  local-root: uploads
