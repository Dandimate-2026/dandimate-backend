openapi: 3.1.0
info:
  title: "두루두루 공개 API"
  version: 0.1.0
  description: "모바일 웹에서 사용하는 단일 Spring Boot 서버의 API입니다. OpenAI는 서버에서만 호출하며 클라이언트에 직접 노출하지 않습니다."
servers:
  - url: https://api.example.com/api/v1
tags:
  - name: 챗봇
  - name: 인증
  - name: 사용자
  - name: 심사용 데모
  - name: 모임방
  - name: 결제
  - name: 플랜
  - name: 사진
  - name: 한마디
  - name: 돌려보기
  - name: 되묻기
  - name: 두루마리
  - name: 답가
  - name: 알림
security:
  - sessionCookie: []
paths:
  /reviewer-demo/activate:
    post:
      tags: [심사용 데모]
      summary: 심사 계정용 샘플 방 생성·연결
      description: |
        심사 기간에만 서버 설정으로 열립니다. 카카오 로그인한 사용자별로 방장 체험방, 멤버 체험방,
        완성된 두루마리 방을 한 번만 생성하여 연결합니다. 실제 다른 사용자의 데이터는 사용하지 않습니다.
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '200':
          description: 이미 만든 심사용 방을 포함해 항상 같은 세 방 ID를 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [hostRoomId, memberRoomId, completedRoomId]
                    properties:
                      hostRoomId: {type: string, format: uuid}
                      memberRoomId: {type: string, format: uuid}
                      completedRoomId: {type: string, format: uuid}
        '401': {description: 로그인 필요}
        '403': {description: 심사용 데모가 닫혔거나 CSRF 오류}
  /room-covers:
    post:
      tags: [모임방]
      summary: 방 생성 전 대표 사진 한 장 업로드
      description: |
        로그인 및 CSRF 필요. multipart/form-data의 file로 JPEG/PNG 2MB 이하, 1600만 화소 이하를 전송합니다.
        presigned PUT 방식이 아니라 백엔드가 파일을 검증하고 S3(로컬 환경은 로컬 저장소)에 저장합니다.
        응답 imageUrl을 방 생성·결제 주문·수정의 coverImageUrl에 넣습니다. coverPhoto.id도 호환 지원합니다. 이야기용 사진 한도에는 포함하지 않습니다.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: 업로드 완료. 파일 자체는 DB에 저장하지 않습니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CoverPhotoView'}
        '401': {description: 로그인 필요}
        '403': {description: CSRF 오류}
        '413': {description: 파일 용량 초과}
        '415': {description: JPEG·PNG 외 형식 또는 MIME 불일치}
        '422': {description: 손상된 이미지 또는 화소 제한 초과}
  /room-covers/{coverId}/image:
    get:
      tags: [모임방]
      summary: 대표 사진 보기 (업로더 또는 해당 방의 현재 참가자)
      parameters:
        - name: coverId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 로컬 저장소의 이미지 바이트}
        '302': {description: 권한 검사 후 유효기간 5분인 S3 GET URL로 이동}
        '401': {description: 로그인 필요}
        '403': {description: 열람 권한 없음}
        '404': {description: 사진 없음}
  /chat/quota:
    get:
      tags: [챗봇]
      summary: 계정별 챗봇 남은 횟수
      description: 무료 4회는 매일 0시 KST 초기화됩니다. 구매 크레딧은 이월되며 처리 중 예약 횟수는 제외합니다.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: 남은 질문 횟수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      freeLimit: {type: integer, const: 4}
                      freeRemaining: {type: integer, minimum: 0, maximum: 4}
                      credits: {type: integer, minimum: 0}
                      resetsAt: {type: string, format: date-time}
  /payments/credit-orders:
    post:
      tags: [결제]
      summary: 챗봇 크레딧 구매 주문
      description: light 10회 900원, basic 30회 1900원, plenty 50회 2900원. 기존 결제 승인 API에서 승인 후 구매 계정에 한 번만 적립합니다.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packId]
              properties:
                packId: {type: string, enum: [light, basic, plenty]}
      responses:
        '201':
          description: 결제 주문
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/PaymentOrder'}
        '503': {description: 결제 키 설정 필요}
  /rooms/{roomId}/members/{memberId}:
    delete:
      tags: [모임방]
      summary: 멤버 내보내기 (방장 전용)
      description: 본인 강퇴 불가. 사진과 이야기는 보존하며 재입장은 차단합니다. 커밋 후 member.left 전송 및 해당 멤버 SSE 종료.
      security: [{sessionCookie: [], csrfToken: []}]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - {name: memberId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: 내보내기 완료}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 방 또는 참가자 없음}
  /invites/{inviteToken}/cover:
    get:
      tags: [모임방]
      summary: 초대 카드 대표 사진
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200': {description: 로컬 대표 사진 파일}
        '302': {description: 만료되는 대표 사진 URL로 이동}
        '404': {description: 유효하지 않은 초대 또는 대표 사진 없음}
  /chat/messages:
    post:
      tags:
      - 챗봇
      summary: 참여 중인 방의 사진 이야기로 추억 대화하기
      description: >-
        열람 가능한 첫 한마디·덧붙임을 벡터와 키워드로 검색하고 사진별 원문을 LLM에 전달합니다.
        같은 conversationId를 유지하면 최근 8회 대화의 구조화된 맥락을 참고합니다.
        conversationId를 생략하면 서버가 새 ID를 발급해 응답에 돌려줍니다. 문답 본문은 로그인 계정별로 보관하며
        GET /chat/conversations와 메시지 조회·삭제 API로 다른 기기에서도 다시 볼 수 있습니다.
        답변 생성은 LLM 1회이며 원문 인용·권한을 서버에서 검증합니다. 의미적 정확성을 보장하지는 않습니다.
        근거 사진은 중복 제거하고 첫 한마디 및 덧붙임 전체와 각 작성자를 반환합니다.
        원문·권한 변경은 409, 색인 준비 중 또는 AI 연결 실패는 503입니다.
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                conversationId:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]{1,64}$'
                  description: 클라이언트가 생성한 대화 ID. 같은 세션·사용자에서만 연결됩니다.
            example:
              message: 경주에서 어떤 추억이 있었지?
              conversationId: trip-chat-1
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 16~128자 요청 식별자. 재시도 시 같은 키를 보내면 기록 질문의 중복 차감을 막습니다.
          schema: {type: string, minLength: 16, maxLength: 128}
      responses:
        '429':
          description: CHAT_LIMIT_EXCEEDED. 무료 횟수와 크레딧 모두 소진. SMALL_TALK, OUT_OF_SCOPE는 무료이고 INSUFFICIENT, INVALID, 오류는 예약을 반환합니다.

        '200':
          description: 답변과 근거. 관련 기록이 없으면 sources는 빈 배열.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          description: 입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 로그인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 원문 또는 열람 권한 변경, 다시 질문 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 잘못된 AI 출력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 색인 준비 중 또는 AI 일시 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: AI 응답 시간 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/room-orders:
    post:
      tags:
      - 결제
      summary: 유료 방 생성 결제 주문
      description: 방은 아직 생성하지 않습니다. LITE/PRO만 가능하며 주문 가격은 서버가 결정합니다. 주문 유효 시간은 30분입니다.
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentOrder'
        '400':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 결제 처리 중 또는 플랜 변경 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PAYMENT_NOT_CONFIGURED 또는 PAYMENT_UNCERTAIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
  /rooms/{roomId}/plan-orders:
    post:
      tags:
      - 결제
      summary: 방 플랜 업그레이드 차액 주문
      description: 방장만 FREE→LITE/PRO, LITE→PRO 가능. LITE→PRO 차액은 현재 3000원. 이미 사용한 한도는
        초기화하지 않습니다.
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentOrder'
        '400':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 결제 처리 중 또는 플랜 변경 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PAYMENT_NOT_CONFIGURED 또는 PAYMENT_UNCERTAIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planType
              properties:
                planType:
                  $ref: '#/components/schemas/RoomPlan'
  /payments/confirm:
    post:
      tags:
      - 결제
      summary: 토스 테스트 결제 승인 및 방 생성·플랜 변경
      description: 테스트 키만 지원. 서버 검증 후 한 번만 적용하며 주문 자체로 멱등성을 보장합니다. DONE의 roomId로 입장하고
        초대 토큰은 기존 재발급 API로 얻습니다. PAYMENT_UNCERTAIN이면 같은 orderId/paymentKey/amount로 재확인합니다.
        결제 처리 중 방 삭제·위임·다른 결제를 차단합니다.
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentOrder'
        '400':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 결제 처리 중 또는 플랜 변경 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PAYMENT_NOT_CONFIGURED 또는 PAYMENT_UNCERTAIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orderId
              - paymentKey
              - amount
              properties:
                orderId:
                  type: string
                  maxLength: 36
                paymentKey:
                  type: string
                  maxLength: 200
                amount:
                  type: integer
                  minimum: 1
  /payments/orders/{orderId}:
    get:
      tags:
      - 결제
      summary: 본인 결제 주문 상태 조회
      description: 주문 소유자만 조회합니다. PROCESSING이면 같은 값으로 confirm을 재시도합니다.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentOrder'
        '400':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 결제 처리 중 또는 플랜 변경 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PAYMENT_NOT_CONFIGURED 또는 PAYMENT_UNCERTAIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
  /rooms/{roomId}/host-transfer:
    post:
      tags:
      - 모임방
      summary: 방장 위임
      description: 현재 방장만 같은 방의 활성 일반 멤버에게 위임합니다. 기존 방장은 일반 멤버가 됩니다. 결제 처리 중에는 409입니다.
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - hostMemberId
                    - previousHostMemberId
                    properties:
                      hostMemberId:
                        type: string
                      previousHostMemberId:
                        type: string
        '400':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 요청 처리 오류
          content:
            application/json:
              schema:
