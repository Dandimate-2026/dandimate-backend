        '422': {description: 'INVALID_CAPACITY: 정원은 현재 참여 인원 이상, 1~8명이어야 함'}
    patch:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "모임방 설정·장소·대표 사진 수정 (방장 전용)"
      description: "place·coverImageUrl 생략 시 유지, null이면 삭제. 본인이 업로드한 대표 사진만 지정 가능합니다. capacity는 방장만 COLLECTING/CIRCULATING 상태에서 현재 참여 인원 이상~8명까지 변경합니다. 정원 오류는 422 INVALID_CAPACITY이며 변경 시 room.updated 이벤트를 보냅니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
