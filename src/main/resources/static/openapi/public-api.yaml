                  data:
                    type: object
                    required: [id, createdAt]
                    properties:
                      id: {type: string, format: uuid}
                      createdAt: {type: string, format: date-time}
        '401': {description: 로그인 필요}
  /users/me/rooms:
    get:
      tags: [사용자]
      summary: 내가 참여 중인 방 목록 조회
      description: 나간 방은 제외합니다. 사진과 이야기의 작성자 기록은 보존됩니다.
      responses:
        '200':
          description: 계정에 연결된 방 목록 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [roomId, name, status, memberId, nickname, role]
                      properties:
                        place: {$ref: '#/components/schemas/NullableRoomPlace'}
                        coverPhoto: {$ref: '#/components/schemas/NullableCoverPhotoView'}
                        coverImageUrl: {type: [string, "null"], description: "대표 사진 업로드 응답 imageUrl. 같은 서버의 /api/v1/room-covers/{id}/image 주소. 생략하면 유지, 수정 시 null은 삭제"}
                        roomId: {type: string, format: uuid}
                        name: {type: string}
                        status: {type: string}
                        memberId: {type: string, format: uuid}
                        nickname: {type: string}
                        role: {type: string, enum: [HOST, MEMBER]}
        '401': {description: 로그인 필요}
  /users/me/map:
    get:
      tags: [사용자]
      summary: 내 지도 조회
      description: >-
        내가 참여 중인 방에서 공개된, 좌표가 있는 사진을 도시별로 묶어 돌려줍니다. 최근 모임 날짜 순입니다.
        bloomed는 완성된 두루마리가 있는지를 뜻합니다. recordCount는 첫 한마디·덧붙임·되묻기 답의 합입니다.
        roomId를 보내면 현재 사용자가 참여 중인 해당 모임방 기록만 집계합니다.
      parameters:
        - name: roomId
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 도시별 핀 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PhotoMap'}
        '401': {description: 로그인 필요}
  /rooms/{roomId}/members/me:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    patch:
      tags: [모임방]
      summary: 이 방에서 사용하는 내 닉네임 변경
      description: 로그인한 활성 참가자 본인만 변경합니다. 공백을 제외한 1~10자이며 방 내 중복 이름은 사용할 수 없습니다. 탈퇴자의 이름도 작성 이력 구분을 위해 유지됩니다.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: {type: string, minLength: 1, maxLength: 10}
      responses:
        '200':
          description: 변경된 참가자 정보
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, nickname, role, flowerCode]
                    properties:
                      id: {$ref: '#/components/schemas/Id'}
                      nickname: {type: string}
                      role: {type: string, enum: [HOST, MEMBER]}
                      flowerCode: {$ref: '#/components/schemas/FlowerCode'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: 로그인 필요}
        '403': {description: 참가자가 아니거나 CSRF 토큰 오류}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: NICKNAME_TAKEN - 방 내 닉네임 중복}
    delete:
      tags: [모임방]
      summary: 모임방 나가기
      description: >-
        일반 참가자의 참여 상태만 종료하고 사진·원문·두루마리·사용량은 보존합니다.
        방 목록과 정원 집계에서 제외하며 방 접근 권한과 실시간 이벤트 구독을 종료합니다.
        유효한 초대 링크로 재입장하면 기존 참가자 ID와 작성 이력을 유지합니다.
        방장은 나갈 수 없으며 기존 방 삭제 API를 이용해야 합니다. 반복 나가기는 204입니다.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': {description: 나가기 완료}
        '401': {description: 로그인 필요}
        '403': {description: 방장이거나 미참가자 또는 CSRF 토큰 오류}
        '404': {$ref: '#/components/responses/NotFound'}
  /rooms/{roomId}/plan-requests:
    post:
      tags: [플랜]
      summary: 방장에게 플랜 변경 요청 알림 보내기
      description: >-
        FREE 방의 활성 일반 참가자만 요청할 수 있습니다. LITE/PRO에서는 요청할 수 없습니다. 방장 알림에 type=PLAN_UPGRADE_REQUESTED,
        resourceType=PHOTO/VOICE/REWEAVE, resourceId=roomId로 저장합니다.
        결제나 플랜 변경은 수행하지 않습니다. 같은 Idempotency-Key 재전송은 알림을 중복 생성하지 않습니다.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, enum: [PHOTO, VOICE, REWEAVE]}
      responses:
        '201':
          description: 방장 알림 생성
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [notificationId, reason, status]
                    properties:
                      notificationId: {$ref: '#/components/schemas/Id'}
                      reason: {type: string, enum: [PHOTO, VOICE, REWEAVE]}
                      status: {type: string, const: REQUESTED}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: 로그인 필요}
        '403': {description: 방장 또는 미참가자 또는 CSRF 토큰 오류}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Idempotency-Key를 다른 요청에 재사용}
  /rooms:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
