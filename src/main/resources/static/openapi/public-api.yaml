          properties:
            askback:
              type: object
              required: [id, status]
              properties:
                id: {$ref: '#/components/schemas/Id'}
                status: {type: string, const: ANSWERED}
            entry: {$ref: '#/components/schemas/Entry'}
    ScrollResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, version, participantCount, memberCount, paragraphs]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            version: {type: integer, minimum: 1}
            participantCount: {type: integer}
            memberCount: {type: integer}
            generatedAt: {type: string, format: date-time}
            paragraphs:
              type: array
              items: {$ref: '#/components/schemas/Paragraph'}
    Paragraph:
