  /plans:
    get:
      tags: [플랜]
      summary: 방 생성 전 플랜 목록·가격·이용 한도 조회
      description: >-
        로그인 없이 FREE, LITE, PRO 순서로 반환합니다. 가격은 원(KRW) 단위이며 방 1개 기준입니다.
        FREE는 POST /rooms, LITE/PRO는 POST /payments/room-orders로 전달합니다.
        이 조회는 결제 주문을 생성하거나 유료 권한을 부여하지 않습니다.
        토스 테스트 시크릿 키를 등록하면 LITE/PRO의 roomCreationAvailable=true입니다. 실제 적용은 결제 승인 후 수행합니다.
        FREE도 실제 방 생성에는 로그인이 필요합니다. 음성 시간 총량 단위는 밀리초입니다.
      security: []
      responses:
        '200':
          description: 플랜 카탈로그
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/PlanCatalogItem'}
  /oauth2/authorization/kakao:
    servers: [{url: /}]
    get:
      tags: [인증]
      summary: 카카오 로그인 시작
      description: "브라우저 페이지 이동으로 호출합니다. 로그인·동의 후 콜백에서 신규 계정을 자동 생성하거나 기존 계정으로 로그인합니다. Swagger Try it out 대신 브라우저에서 여세요."
      security: []
      responses:
        '302': {description: 카카오 로그인 화면으로 이동}
        '503': {description: 서버 카카오 설정 미완료}
  /login/oauth2/code/kakao:
    servers: [{url: /}]
    get:
      tags: [인증]
      summary: 카카오 인증 콜백
      description: "카카오가 호출하는 경로입니다. 인가 코드·state 검증 후 세션을 발급하고 설정된 프론트엔드로 이동합니다. 직접 호출하지 않습니다."
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        '302': {description: 로그인 완료 후 프론트엔드로 이동}
        '401': {description: 인증 실패 또는 유효하지 않은 state}
        '503': {description: 서버 카카오 설정 미완료}
  /auth/csrf:
    get:
      tags: [인증]
      summary: 요청 위조 방지 토큰 조회
      description: "응답 data.token을 쓰기 요청의 X-CSRF-TOKEN 헤더에 넣습니다. 로그인·로그아웃 후 다시 조회하세요. 쿠키는 credentials include로 전송합니다."
      security: []
      responses:
        '200':
          description: CSRF 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [headerName, token]
                    properties:
                      headerName: {type: string, const: X-CSRF-TOKEN}
                      token: {type: string}
  /auth/logout:
    post:
      tags: [인증]
      summary: 서비스 로그아웃
      description: "현재 서비스 세션을 종료합니다. 카카오 계정 전체 로그아웃이나 연결 해제는 수행하지 않습니다."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': {description: 로그아웃 완료}
        '403': {description: CSRF 토큰 누락 또는 불일치}
  /users/me:
    get:
      tags: [사용자]
      summary: 내 계정 조회
