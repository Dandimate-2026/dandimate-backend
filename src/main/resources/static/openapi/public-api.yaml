      summary: "답가용 음성 받아쓰기 초안 생성"
      description: >-
        첫 한마디는 Free/Lite/Pro 최대 30/60/120초, 덧붙임·되묻기 답변·답가는 20/30/60초입니다.
        최소 길이는 첫 한마디 5초, 나머지 1초입니다. 방 전체 총량은 15/40/90분입니다.
        실제 파일 길이를 측정하며 측정 불가 시 거절합니다. STT 성공 시 차감하며 확정·삭제·만료 시 환급하지 않습니다.
        실패 시 예약량을 해제합니다. 같은 멤버·대상·Idempotency-Key와 동일 음성은 기존 초안을 반환하고 재차감하지 않습니다.
        동일 키로 다른 음성/종류를 보내거나 처리 중인 요청을 반복하면 409입니다. 실패한 요청은 동일 키로 재시도할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ParagraphId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: "받아쓰기 초안"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranscriptionDraftResponse'}
        '400': {description: '요청 키 누락 또는 음성 길이 측정 불가'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '502': {$ref: '#/components/responses/AiFailure'}
  /replies/{replyId}:
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "내 답가 삭제 및 문단 복구 또는 다시 엮기"
      parameters:
        - name: replyId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '202':
          description: "문단 복구 작업 접수 완료"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAcceptedResponse'}
  /paragraphs/{paragraphId}/fidelity-rating:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "원문 충실도 평가 등록 또는 수정"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: {type: integer, minimum: 1, maximum: 5}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /paragraphs/{paragraphId}/reactions/ah-matda:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "'아 맞다' 반응 추가"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "'아 맞다' 반응 취소"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
      responses:
        '204': {description: "삭제 완료"}
  /rooms/{roomId}/notifications:
    get:
      tags: [알림]
      summary: "내 알림 목록 조회"
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: "알림 목록"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Notification'}
  /notifications/{notificationId}/read:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [알림]
      summary: "알림 읽음 처리"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /rooms/{roomId}/events:
    get:
      tags: [알림]
      summary: "실시간 알림 수신 (SSE 연결을 사용할 수 없으면 5초 간격으로 조회)"
      description: |
        DB 커밋 후 해당 방 구독자에게 이벤트를 전달합니다. 이벤트 수신 시 REST API를 다시 조회합니다.
        - member.joined: 신규 입장·탈퇴 후 재입장. 데이터 {memberId}. 기존 참가자의 재접속에는 발행하지 않습니다.
        - member.left: 방 나가기. 데이터 {memberId}.
        - member.updated: 닉네임 변경 {memberId}, 방장 위임 {memberId, previousHostId}.
        - room.updated: 방 이름·모임 날짜·마감 수정 {roomId}, 결제 후 플랜 변경 {planType}.
        - photo.uploaded·photo.published·photo.deleted: 사진 및 참여현황 재조회.
        - entry.created·entry.updated·entry.deleted: 한마디·덧붙임 및 참여현황 재조회.
        - scroll.template.updated: 방 공통 두루마리 템플릿 재조회 {roomId, scrollTemplateId}.
        - askback.updated: 질문 상태 변경 {askbackId}. 해당 질문 대상자에게만 전달합니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: streamToken
          in: query
          required: true
          description: "특정 모임방과 참여자에게 연결된 일회용 토큰 (유효 시간 60초)"
          schema: {type: string}
      responses:
        '200':
          description: "실시간 알림 이벤트 스트림 (SSE)"
          content:
            text/event-stream:
              schema: {type: string}
  /rooms/{roomId}/event-token:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [알림]
      summary: "실시간 알림 연결용 단기 일회용 토큰 발급"
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '201':
          description: "실시간 알림 연결용 토큰"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [eventsUrl, expiresAt]
                    properties:
                      eventsUrl: {type: string, format: uri}
                      expiresAt: {type: string, format: date-time}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: "카카오 로그인 후 브라우저가 관리하는 HttpOnly 세션 쿠키. 참가자 Bearer 토큰은 사용하지 않습니다."
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: "GET /api/v1/auth/csrf에서 받은 token. POST/PUT/PATCH/DELETE 요청에 필요하며 로그인 후 다시 조회합니다."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    InviteToken:
      name: inviteToken
      in: path
      required: true
      schema: {type: string, minLength: 22}
    RoomId:
      name: roomId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    EntryId:
      name: entryId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ParagraphId:
      name: paragraphId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    AskbackId:
      name: askbackId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
  responses:
    Ok:
      description: "요청 처리 성공"
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {type: object}
    BadRequest:
      description: "잘못된 요청"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: "접근 권한 없음"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: "요청한 대상을 찾을 수 없음"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: "현재 상태 또는 기존 데이터와 충돌"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unprocessable:
      description: "입력값 검증 실패 또는 기능별 제한 초과"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AiFailure:
      description: "AI 서비스 호출 또는 검증 실패"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    RoomPlace:
      type: object
      required: [placeName, address, latitude, longitude]
      properties:
        placeName: {type: string, minLength: 1, maxLength: 200}
        address: {type: string, maxLength: 500}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    NullableRoomPlace:
      anyOf: [{$ref: '#/components/schemas/RoomPlace'}, {type: 'null'}]
    CoverPhotoRef:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid, description: "POST /room-covers에서 받은 본인 업로드 ID"}
    NullableCoverPhotoRef:
      anyOf: [{$ref: '#/components/schemas/CoverPhotoRef'}, {type: 'null'}]
    CoverPhotoView:
      type: object
      required: [id, imageUrl]
      properties:
        id: {type: string, format: uuid}
        imageUrl: {type: string, description: "API 서버 기준 상대 경로. 같은 도메인의 로그인 쿠키로 조회. S3 사용 시 권한 확인 후 서명 URL로 이동"}
    NullableCoverPhotoView:
      anyOf: [{$ref: '#/components/schemas/CoverPhotoView'}, {type: 'null'}]
    ChatAuthor:
      type: object
      required:
      - userId
      - memberId
      - nickname
      - role
      - flowerCode
      properties:
        userId:
          type:
          - string
          - 'null'
          description: 기존 비회원 작성자는 null
        memberId: &id001
          type: string
        nickname: *id001
        role: *id001
        flowerCode: *id001
    ChatSource:
      type: object
      required:
      - room
      - photo
      - entries
      properties:
        room:
          type: object
          required:
          - roomId
          - name
          properties:
            roomId: *id001
            name: *id001
            meetingDate:
              type: [string, 'null']
              format: date
        firstEntry:
          description: 열람 가능한 첫 한마디. 없으면 null.
          anyOf:
          - $ref: '#/components/schemas/ChatEntry'
          - type: 'null'
        photo:
          type: object
          required:
          - photoId
          - imageUrl
          - createdAt
          - uploader
          properties:
            photoId: *id001
            imageUrl:
              type: string
              description: 만료 시간이 있는 사진 서명 URL
            createdAt:
              type: string
              format: date-time
            uploader:
              $ref: '#/components/schemas/ChatAuthor'
        entries:
          type: array
          description: 해당 사진의 열람 가능한 덧붙임 전체. createdAt, entryId 오름차순.
          items:
            type: object
            required:
            - entryId
            - text
            - createdAt
            - author
            properties:
              entryId: *id001
              text: *id001
              createdAt:
                type: string
                format: date-time
              author:
                $ref: '#/components/schemas/ChatAuthor'
    ChatEntry:
      type: object
      properties:
        entryId: {type: string}
        text: {type: string}
        createdAt: {type: string, format: date-time}
        author: {$ref: '#/components/schemas/ChatAuthor'}
    ChatMessageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [answer, sources, citations, context, decision, outcome]
          properties:
            outcome: {type: string, enum: [ANSWER, CONFLICT, INSUFFICIENT, SMALL_TALK, INVALID, OUT_OF_SCOPE], description: "정상 기록 답변, 기록 충돌, 근거 부족, 잡담, 근거 검증 실패, 서비스 범위 밖"}
            conversationId: {type: string, description: "서버가 발급하거나 이어받은 대화 ID. 다음 메시지에 보내면 문맥을 이어갑니다."}
            answer: {type: string}
            sources:
              type: array
              items: {$ref: '#/components/schemas/ChatSource'}
            citations:
              type: array
              description: 답변 문장별 실제 인용. 같은 글이 여러 문장을 뒷받침할 수 있습니다.
              items:
                type: object
                properties:
                  statementIndex: {type: integer, minimum: 0}
                  entryId: {type: string}
                  photoId: {type: string}
                  kind: {type: string}
                  quote: {type: string}
                  author: {$ref: '#/components/schemas/ChatAuthor'}
            context:
              type: object
              description: 서버가 관리하는 해석 상태. 요청에 다시 보내지 않습니다.
              properties:
                topic: {type: string}
                target: {type: string}
                criterion: {type: string}
                direction: {type: string}
                rankPosition: {type: integer}
            decision:
              type: object
              description: AI가 답한 판단 요약이며 사용자 원문 사실이 아닙니다. 요청에 다시 보내지 않습니다.
              properties:
                criterion: {type: string}
                scope: {type: string}
                rankedTargets: {type: array, items: {type: string}}
                selectedTarget: {type: string}
                direction: {type: string}
                summary: {type: string}
                revisesId: {type: string}
                rankPosition: {type: integer}
    PaymentOrder:
      type: object
      required:
      - orderId
      - orderName
      - amount
      - currency
      - status
      - roomId
      - fromPlan
      - targetPlan
      - testMode
      properties:
        orderType: {type: string, enum: [ROOM, CREDIT]}
        packId: {type: [string, 'null'], enum: [light, basic, plenty, null]}
        creditAmount: {type: integer, minimum: 0}

        orderId:
          type: string
        orderName:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          const: KRW
        status:
          type: string
          enum:
          - READY
          - PROCESSING
          - DONE
          - FAILED
        roomId:
          type:
          - string
          - 'null'
        fromPlan:
          anyOf: [{$ref: '#/components/schemas/RoomPlan'}, {type: 'null'}]
        targetPlan:
          anyOf: [{$ref: '#/components/schemas/RoomPlan'}, {type: 'null'}]
        testMode:
          type: boolean
          const: true
    AskbackQueue:
      type: object
      required:
      - nextAskback
      - remainingCount
      - completed
      properties:
        nextAskback:
          anyOf:
          - $ref: '#/components/schemas/Askback'
          - type: 'null'
        remainingCount:
          type: integer
          minimum: 0
        completed:
          type: boolean
    Id:
      type: string
      minLength: 16
      maxLength: 40
      examples: [01JABCD1234EFGH5678]
    RoomStatus:
      type: string
      enum: [COLLECTING, CIRCULATING, WEAVING, GROWING]
    CloseMode:
      type: string
      enum: [EARLY, DEMO]
    FlowerCode:
      type: string
      enum: [AZALEA, FORSYTHIA, ROYAL_AZALEA, CANOLA, LILAC, FORGET_ME_NOT, TEAL, PURPLE]
    Consent:
      type: object
      required: [version, terms, mediaProcessing, externalAiProcessing]
      properties:
        version: {type: string}
        terms: {type: boolean, const: true}
        mediaProcessing: {type: boolean, const: true}
        externalAiProcessing: {type: boolean, const: true}
    Member:
      type: object
      required: [id, nickname, role, flowerCode]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        nickname: {type: string, minLength: 1, maxLength: 10}
        role: {type: string, enum: [HOST, MEMBER]}
        flowerCode: {$ref: '#/components/schemas/FlowerCode'}
        photoCount: {type: integer, minimum: 0, maximum: 10}
        storyCount: {type: integer, minimum: 0}
        participatedPhotoCount: {type: integer, minimum: 0, description: "내 사진 또는 내 한마디·덧붙임이 있는 고유 완료 사진 수"}
        totalPhotoCount: {type: integer, minimum: 0, description: "방의 완료 사진 수. 참여율 분모"}
        responseRate: {type: number, minimum: 0, maximum: 1}
    PlanCatalogItem:
      type: object
      required: [planType, price, currency, billingUnit, paymentRequired, roomCreationAvailable, maxCapacity, photosPerMember, photosPerRoom, firstMaxSeconds, otherMaxSeconds, voiceLimitMs, regenerationLimit]
      properties:
        planType: {$ref: '#/components/schemas/RoomPlan'}
        price: {type: integer, minimum: 0, description: "방 1개 가격. FREE 0 / LITE 2900 / PRO 5900원"}
        currency: {type: string, const: KRW}
        billingUnit: {type: string, const: ROOM, description: "계정 구독이 아닌 방 단위 요금"}
        paymentRequired: {type: boolean, description: "유료 플랜 여부"}
        roomCreationAvailable: {type: boolean, description: "현재 생성 지원 여부. true여도 방 생성에는 로그인 필요"}
        unavailableReason: {type: [string, 'null'], enum: [PAYMENT_NOT_CONFIGURED, null], description: "결제 미설정 시 PAYMENT_NOT_CONFIGURED, 그 외 null"}
        maxCapacity: {type: integer, const: 8, description: "방장 포함 선택 가능한 최대 정원"}
        photosPerMember: {type: integer, description: "방별 멤버 사진 한도 3/6/10장"}
        photosPerRoom: {type: integer, description: "방 전체 사진 한도 24/48/80장"}
        firstMaxSeconds: {type: integer, description: "첫 한마디 최대 30/60/120초"}
        otherMaxSeconds: {type: integer, description: "덧붙임·되묻기 답변·답가 최대 20/30/60초"}
        voiceLimitMs: {type: integer, format: int64, description: "방 전체 음성 한도 900000/2400000/5400000ms (15/40/90분)"}
        regenerationLimit: {type: integer, description: "재엮기 한도 3/6/12회"}
    RoomPlan:
      type: string
      enum: [FREE, LITE, PRO]
      description: "방별 플랜. 계정 전체에 적용되지 않습니다."
    RoomQuota:
      type: object
      description: "사진은 현재 보유량(업로드 대기 포함), 음성은 STT 성공 누적량. 재엮기는 수동 요청과 답가 반영 시도를 합산합니다. 최초 생성은 제외합니다."
      properties:
        photosPerMember: {type: integer, minimum: 0, description: "멤버당 사진 한도 3/6/10"}
        photosPerRoom: {type: integer, minimum: 0, description: "방당 사진 한도 24/48/80"}
        photoCount: {type: integer, minimum: 0, description: "방 전체 사진 수"}
        myPhotoCount: {type: integer, minimum: 0, description: "현재 멤버 사진 수"}
        photosRemaining: {type: integer, minimum: 0, description: "방 전체 남은 사진 수"}
        myPhotosRemaining: {type: integer, minimum: 0, description: "현재 멤버의 남은 사진 수"}
        firstMaxSeconds: {type: integer, minimum: 0, description: "첫 한마디 최대 초 30/60/120"}
        otherMaxSeconds: {type: integer, minimum: 0, description: "덧붙임·되묻기 답변·답가 최대 초 20/30/60"}
        voiceLimitMs: {type: integer, minimum: 0, description: "방 전체 음성 한도 밀리초"}
        voiceUsedMs: {type: integer, minimum: 0, description: "STT 성공 누적 밀리초"}
        voiceReservedMs: {type: integer, minimum: 0, description: "현재 STT 처리 중인 밀리초"}
        voiceRemainingMs: {type: integer, minimum: 0, description: "사용량과 예약량을 뺀 남은 밀리초"}
        regenerationLimit: {type: integer, minimum: 0, description: "재엮기 한도 3/6/12"}
        regenerationCount: {type: integer, minimum: 0, description: "사용한 재엮기 횟수"}
        regenerationsRemaining: {type: integer, minimum: 0, description: "남은 재엮기 횟수"}
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name, meetingDate, hostNickname, consent, planType]
      description: "POST /rooms는 FREE 전용. LITE/PRO는 같은 본문으로 POST /payments/room-orders 호출 후 결제 승인을 완료해야 생성됩니다."
      properties:
        place: {$ref: '#/components/schemas/NullableRoomPlace'}
        coverPhoto: {$ref: '#/components/schemas/NullableCoverPhotoRef'}
        coverImageUrl: {type: [string, "null"], description: "대표 사진 업로드 응답 imageUrl. 같은 서버의 /api/v1/room-covers/{id}/image 주소. 생략하면 유지, 수정 시 null은 삭제"}
        planType: {$ref: '#/components/schemas/RoomPlan'}
        capacity: {type: integer, minimum: 1, maximum: 8, default: 8, description: "방장 포함 정원. 생략 시 8명"}
        name: {type: string, minLength: 1, maxLength: 20}
        meetingDate: {type: string, format: date}
        hostNickname: {type: string, minLength: 1, maxLength: 10}
        consent: {$ref: '#/components/schemas/Consent'}
    CreateRoomResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [room, member, inviteToken]
          properties:
            room: {$ref: '#/components/schemas/RoomSummary'}
            member: {$ref: '#/components/schemas/Member'}
            inviteToken: {type: string}
    RoomSummary:
      type: object
      required: [id, name, status, deadlineAt]
      properties:
        createdAt: {type: string, format: date-time}
        deleteAt: {type: string, format: date-time, description: "방 생성 완료일로부터 1년 뒤 자동 삭제 예정 시각"}
        deadlineChangedByHost: {type: boolean, description: "방장의 마감 변경 이력 여부. 엮기 전까지 미래 시각으로 횟수 제한 없이 변경 가능"}
        place: {$ref: '#/components/schemas/NullableRoomPlace'}
        coverPhoto: {$ref: '#/components/schemas/NullableCoverPhotoView'}
        coverImageUrl: {type: [string, "null"], description: "대표 사진 업로드 응답 imageUrl. 같은 서버의 /api/v1/room-covers/{id}/image 주소. 생략하면 유지, 수정 시 null은 삭제"}
        id: {$ref: '#/components/schemas/Id'}
        capacity: {type: integer, minimum: 1, maximum: 8}
        planType: {$ref: '#/components/schemas/RoomPlan'}
        quota:
          allOf: [{$ref: '#/components/schemas/RoomQuota'}]
          description: "방 홈 조회에 포함. 생성/입장 응답에는 포함하지 않습니다."
        name: {type: string}
        meetingDate: {type: string, format: date}
        status: {$ref: '#/components/schemas/RoomStatus'}
        deadlineAt: {type: [string, 'null'], format: date-time, description: "방장이 선택한 기록 마감·두루마리 생성 시작 시각. 아직 정하지 않았다면 null"}
    InvitePreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [roomId, alreadyJoined, roomName, status, memberCount, capacity, flowers, canJoin]
          properties:
            roomId: {type: string, format: uuid, description: "초대 링크가 가리키는 방 ID. 방 상세 조회에는 참가자 인증이 필요합니다."}
            inviterNickname: {type: [string, "null"], description: "고정 방 초대의 현재 방장 이름"}
            coverImageUrl: {type: [string, "null"], description: "초대 토큰으로 접근하는 대표 사진 절대 URL"}
            alreadyJoined: {type: boolean, description: "현재 로그인 계정의 방 참여 여부. 방장 포함. 미로그인은 false이므로 로그인 후 다시 조회해야 합니다."}
            roomName: {type: string}
            meetingDate: {type: string, format: date}
            status: {$ref: '#/components/schemas/RoomStatus'}
            memberCount: {type: integer, minimum: 0, maximum: 8}
            capacity: {type: integer, minimum: 1, maximum: 8, description: "방장 포함 선택 정원"}
            flowers:
              type: array
              items: {$ref: '#/components/schemas/FlowerCode'}
            canJoin: {type: boolean, description: "신규 입장 정원 여유. false여도 alreadyJoined=true인 기존 참가자는 방에 접근할 수 있습니다."}
    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [nickname, consent]
      properties:
        nickname: {type: string, minLength: 1, maxLength: 10}
        consent: {$ref: '#/components/schemas/Consent'}
    JoinRoomResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [room, member]
          properties:
            room: {$ref: '#/components/schemas/RoomSummary'}
            member: {$ref: '#/components/schemas/Member'}
    RoomHomeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [room, me, members, todayFlowers, myTodo, unreadCount, allCompleted]
          properties:
            room: {$ref: '#/components/schemas/RoomSummary'}
            me: {$ref: '#/components/schemas/Member'}
            members:
              type: array
              items: {$ref: '#/components/schemas/Member'}
            todayFlowers:
              description: "이전 필드명 호환. 날짜 제한 없이 방에 핀 꽃 전체를 반환합니다."
              type: array
              items:
                type: object
                required: [memberId, flowerCode, entryKind]
                properties:
                  memberId: {$ref: '#/components/schemas/Id'}
                  flowerCode: {$ref: '#/components/schemas/FlowerCode'}
                  entryKind: {type: string, enum: [FIRST, ADDON]}
            myTodo:
              type: object
              required: [needsFirstEntry, pendingCirculationCount, topAskback]
              properties:
                needsFirstEntry: {type: boolean}
                pendingCirculationCount: {type: integer, minimum: 0}
                topAskback:
                  anyOf:
                    - type: object
                      required: [id, question]
                      properties:
                        id: {$ref: '#/components/schemas/Id'}
                        question: {type: string, maxLength: 60}
                    - type: 'null'
            unreadCount: {type: integer, minimum: 0}
            allCompleted: {type: boolean}
    UploadFileRequest:
      type: object
      additionalProperties: false
      required: [clientFileId, fileName, contentType, sizeBytes, displayOrder]
      properties:
        clientFileId: {type: string, maxLength: 64}
        fileName: {type: string, maxLength: 255}
        contentType: {type: string, enum: [image/jpeg, image/png, image/heic, image/heif]}
        sizeBytes: {type: integer, minimum: 1, maximum: 2000000}
        displayOrder: {type: integer, minimum: 1, maximum: 10, description: "Free 1~3 / Lite 1~6 / Pro 1~10"}
    UploadRequestsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uploads]
          properties:
            uploads:
              type: array
              items:
                type: object
                required: [clientFileId, photoId, uploadUrl, expiresAt]
                properties:
                  clientFileId: {type: string}
                  photoId: {$ref: '#/components/schemas/Id'}
                  uploadUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
                  requiredHeaders: {type: object, additionalProperties: {type: string}}
    TranscriptionDraftResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transcriptionId, audioAssetId, transcript, expiresAt]
          properties:
            transcriptionId: {$ref: '#/components/schemas/Id'}
            audioAssetId: {$ref: '#/components/schemas/Id'}
            transcript: {type: string}
            detectedLanguages: {type: array, items: {type: string}}
            expiresAt: {type: string, format: date-time}
    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [kind, inputMode, transcript]
      properties:
        kind: {type: string, enum: [FIRST, ADDON]}
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcriptionId: {$ref: '#/components/schemas/Id'}
        transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 최대 3000자. TEXT 첫 한마디 5~300자, 덧붙임 1~200자"}
      allOf:
        - if:
            properties: {inputMode: {const: VOICE}}
          then:
            required: [transcriptionId]
    Entry:
      type: object
      required: [id, photoId, member, kind, inputMode, transcript, confirmedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        photoId: {$ref: '#/components/schemas/Id'}
        member: {$ref: '#/components/schemas/Member'}
        kind: {type: string, enum: [FIRST, ADDON, ASKBACK_ANSWER]}
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcript: {type: string}
        audioUrl: {type: [string, 'null'], format: uri}
        confirmedAt: {type: string, format: date-time}
    EntryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [entry]
          properties:
            entry: {$ref: '#/components/schemas/Entry'}
            askbackJobId:
              anyOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
    CirculationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [cards]
          properties:
            cards:
              type: array
              items:
                type: object
                required: [photo, firstEntry, myResponse, locked, otherEntries]
                properties:
                  photo: {$ref: '#/components/schemas/Photo'}
                  firstEntry:
                    anyOf:
                      - $ref: '#/components/schemas/Entry'
                      - type: 'null'
                  myResponse:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [NONE, ADDON, PASSED, OWN_PHOTO]}
                  locked: {type: boolean}
                  lockReason: {type: [string, 'null'], enum: [RESPOND_FIRST, null]}
                  otherEntries:
                    type: array
                    items: {$ref: '#/components/schemas/Entry'}
            nextCursor: {type: [string, 'null']}
    Photo:
      type: object
      required: [id, imageUrl, uploader, displayOrder]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        imageUrl: {type: string, format: uri}
        uploader: {$ref: '#/components/schemas/Member'}
        displayOrder: {type: integer}
        location:
          anyOf:
            - $ref: '#/components/schemas/PhotoLocation'
            - type: 'null'
    PhotoLocation:
      type: object
      required: [placeName]
      properties:
        placeId: {type: [string, "null"], maxLength: 100, description: "카카오 장소 ID. 직접 입력한 장소는 null"}
        placeName: {type: string, maxLength: 60}
        address: {type: [string, 'null']}
        city: {type: [string, 'null'], description: "주소에서 뽑은 도시 이름. 예: 경주"}
        adminAreaCode: {type: [string, 'null'], description: "시·군 단위 10자리 행정구역 코드"}
        latitude: {type: [number, 'null']}
        longitude: {type: [number, 'null']}
    Place:
      type: object
      required: [placeName, address, latitude, longitude]
      properties:
        placeId: {type: [string, "null"], maxLength: 100, description: "카카오 장소 ID. 직접 입력한 장소는 null"}
        placeName: {type: string}
        address: {type: string}
        city: {type: [string, 'null']}
        adminAreaCode: {type: [string, 'null'], description: "시·군 단위 10자리 행정구역 코드. 현재 대구·경북만 제공"}
        latitude: {type: number}
        longitude: {type: number}
    PhotoMap:
      type: object
      required: [cities]
      properties:
        cities:
          type: array
          items:
            type: object
            required: [city, adminAreaCode, latitude, longitude, photoCount, recordCount, bloomed, summary, summaryStatus, rooms, places]
            properties:
              city: {type: string}
              adminAreaCode: {type: [string, 'null']}
              latitude: {type: number}
              longitude: {type: number}
              photoCount: {type: integer}
              recordCount: {type: integer}
              bloomed: {type: boolean}
              summary: {type: [string, 'null'], maxLength: 200, description: "완성 전 방도 포함. 공개 첫 한마디 요약 또는 장소·기록 발췌. 잠긴 덧붙임은 제외"}
              summaryStatus: {type: string, enum: [NONE, GENERATING, READY, FAILED]}
              rooms:
                type: array
                items:
                  type: object
                  required: [roomId, name, meetingDate, status, scrollReady, photoCount, recordCount, summary, summaryStatus]
                  properties:
                    roomId: {$ref: '#/components/schemas/Id'}
                    name: {type: string}
                    meetingDate: {type: string, format: date}
                    status: {type: string}
                    scrollReady: {type: boolean}
                    photoCount: {type: integer}
                    recordCount: {type: integer}
                    summary: {type: [string, 'null'], maxLength: 200}
                    summaryStatus: {type: string, enum: [NONE, GENERATING, READY, FAILED]}
              places:
                type: array
                items:
                  type: object
                  required: [photoId, roomId, placeName, city, adminAreaCode, latitude, longitude, imageUrl, uploader, firstEntrySnippet, placeGroupKey, recordCount, recordIds]
                  properties:
                    photoId: {$ref: '#/components/schemas/Id'}
                    roomId: {$ref: '#/components/schemas/Id'}
                    imageUrl: {type: [string, "null"], description: "만료되는 이미지 조회 URL"}
                    uploader:
                      type: object
                      properties:
                        userId: {type: [string, "null"]}
                        nickname: {type: string}
                        flowerCode: {type: string}
                    firstEntrySnippet: {type: [string, "null"], maxLength: 100, description: "첫 한마디 앞 100자. 없는 경우 null"}
                    placeId: {type: [string, "null"]}
                    placeGroupKey: {type: string, description: "같은 장소 묶음 기준. 카카오 장소 ID가 있으면 이를 우선 사용"}
                    placeName: {type: string}
                    city: {type: string}
                    adminAreaCode: {type: [string, 'null']}
                    latitude: {type: number}
                    longitude: {type: number}
                    recordCount: {type: integer, minimum: 0}
                    recordIds:
                      type: array
                      items: {$ref: '#/components/schemas/Id'}
    Askback:
      type: object
      required: [id, photo, gapType, question, evidenceNicknames, status, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        photo: {$ref: '#/components/schemas/Photo'}
        gapType: {type: string, enum: [CONFLICT, MISSING_REASON, NO_ADDON, MISSING_CONTEXT]}
        question: {type: string, maxLength: 60}
        evidenceNicknames:
          type: array
          items: {type: string, minLength: 1, maxLength: 10}
        status: {$ref: '#/components/schemas/AskbackStatus'}
        firstEntry:
          anyOf:
            - $ref: '#/components/schemas/Entry'
            - type: 'null'
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    AskbackStatus:
      type: string
      enum: [PENDING, ANSWERED, FORGOT, SKIPPED, EXPIRED, CANCELLED]
    AskbackListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [askbacks]
          properties:
            askbacks:
              type: array
              items: {$ref: '#/components/schemas/Askback'}
    AskbackDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [askback]
          properties:
            askback: {$ref: '#/components/schemas/Askback'}
    AskbackAnswerRequest:
      type: object
      additionalProperties: false
      required: [inputMode, transcript]
      properties:
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcriptionId: {$ref: '#/components/schemas/Id'}
        transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 1~3000자, TEXT 1~200자"}
      allOf:
        - if:
            properties: {inputMode: {const: VOICE}}
          then:
            required: [transcriptionId]
    AskbackAnswerResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [askback, entry]
          properties:
            askback:
              type: object
              required: [id, status]
              properties:
                id: {$ref: '#/components/schemas/Id'}
                status: {type: string, const: ANSWERED}
            entry: {$ref: '#/components/schemas/Entry'}
    ScrollResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, version, participantCount, memberCount, paragraphs]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            version: {type: integer, minimum: 1}
            participantCount: {type: integer}
            memberCount: {type: integer}
            generatedAt: {type: string, format: date-time}
            paragraphs:
              type: array
              items: {$ref: '#/components/schemas/Paragraph'}
    Paragraph:
      type: object
      required: [id, photo, body, version, sources, replyCount, ahMatdaCount, aiGenerated]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        photo: {$ref: '#/components/schemas/Photo'}
        body: {type: string}
        version: {type: integer, minimum: 1}
        sources:
          type: array
          items:
            type: object
            required: [entryId, member, quote]
            properties:
              entryId: {$ref: '#/components/schemas/Id'}
              member: {$ref: '#/components/schemas/Member'}
              quote: {type: string}
        replyCount: {type: integer, minimum: 0}
        ahMatdaCount: {type: integer, minimum: 0}
        aiGenerated: {type: boolean, const: true}
    CreateReplyRequest:
      type: object
      additionalProperties: false
      required: [inputMode, transcript]
      properties:
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcriptionId: {$ref: '#/components/schemas/Id'}
        transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 1~3000자, TEXT 1~200자"}
    JobAcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [job]
          properties:
            job: {$ref: '#/components/schemas/Job'}
    JobResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Job'}
    Job:
      type: object
      required: [id, type, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type: {type: string, enum: [ASKBACK_ANALYZE, WEAVE_SCROLL, REPLY_REWEAVE, MEDIA_DELETE]}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        progress:
          type: object
          properties:
            completed: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
        errorCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, resourceType, resourceId, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type: {type: string, enum: [ASKBACK_RECEIVED, SCROLL_READY, REPLY_APPLIED, PLAN_UPGRADE_REQUESTED, ROOM_DELETION_DUE_30D, ROOM_DELETION_DUE_7D, ROOM_DELETION_DUE_1D]}
        resourceType: {type: string}
        resourceId: {$ref: '#/components/schemas/Id'}
        message: {type: [string, 'null']}
        scheduledFor: {type: [string, 'null'], format: date-time, description: "자동 삭제 예정 시각"}
        readAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            requestId: {type: string}
