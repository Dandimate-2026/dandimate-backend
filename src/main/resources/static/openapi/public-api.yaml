        alreadyJoined로 반환합니다. true이면 신규 입장 요청 없이 roomId에 해당하는 방으로 이동하세요.
        canJoin은 신규 참가자를 받을 정원 여유만 뜻하므로 alreadyJoined를 먼저 확인해야 합니다.
        미로그인은 alreadyJoined=false이며, 카카오 로그인 완료 후 이 API를 다시 조회해야 합니다.
