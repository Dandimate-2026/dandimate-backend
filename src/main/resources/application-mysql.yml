spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/durooduroo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  # 테이블은 Flyway(db/migration/V*.sql)가 만들고 바꾼다. Hibernate는 엔티티와 테이블이 맞는지만 검사한다.
  # 이미 ddl-auto=update로 만든 DB는 기록 테이블이 없으므로 V1을 적용된 것으로 보고 이어서 진행한다(baseline).
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

openai:
  api-key: ${OPENAI_API_KEY:}
  stt-model: ${OPENAI_STT_MODEL:gpt-transcribe}
  text-model: ${OPENAI_TEXT_MODEL:}

storage:
  type: ${STORAGE_TYPE:local}
  local-root: ${STORAGE_LOCAL_ROOT:uploads}
  aws-region: ${AWS_REGION:ap-northeast-2}
  aws-bucket: ${AWS_S3_BUCKET:}
  aws-endpoint: ${AWS_S3_ENDPOINT:}

# 데모 마감·되묻기 즉시 실행 (FR-H9). 운영에서는 false로 둔다.
app:
  demo-enabled: ${DEMO_ENABLED:false}
