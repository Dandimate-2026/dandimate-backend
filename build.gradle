plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dandimate'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.knuddels:jtokkit:1.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // mysql 프로필의 테이블 변경 이력 (src/main/resources/db/migration). local(H2)은 엔티티로 테이블을 만든다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'software.amazon.awssdk:s3:2.29.52'
    // 브라우저 Web Push(VAPID 인증·암호화) 발송. 구독 저장만이 아니라 실제 알림 전달에 사용한다.
    implementation 'nl.martijndwars:web-push:5.1.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.bitbucket.b_c:jose4j:0.7.9'
    // 계약서(static/openapi/public-api.yaml)를 /swagger-ui.html에서 보여 준다. 코드에서 문서를 생성하지는 않는다.
    implementation 'org.webjars:swagger-ui:5.17.14'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 응답을 계약서 JSON Schema(2020-12)로 검증한다.
    testImplementation 'com.networknt:json-schema-validator:1.5.6'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
