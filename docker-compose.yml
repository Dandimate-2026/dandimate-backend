services:
  mysql:
    image: mysql:8.4
    container_name: durooduroo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: durooduroo
      MYSQL_USER: durooduroo
      MYSQL_PASSWORD: durooduroo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - durooduroo_mysql:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: durooduroo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - durooduroo_minio:/data

volumes:
  durooduroo_mysql:
  durooduroo_minio:
