openapi: 3.1.0
info:
  title: "두루두루 공개 API"
  version: 0.1.0
  description: "모바일 웹에서 사용하는 단일 Spring Boot 서버의 API입니다. OpenAI는 서버에서만 호출하며 클라이언트에 직접 노출하지 않습니다."
servers:
  - url: https://api.example.com/api/v1
tags:
  - name: 인증
  - name: 사용자
  - name: 모임방
  - name: 사진
  - name: 한마디
  - name: 돌려보기
  - name: 되묻기
  - name: 두루마리
  - name: 답가
  - name: 알림
security:
  - sessionCookie: []
paths:
  /oauth2/authorization/kakao:
    servers: [{url: /}]
    get:
      tags: [인증]
      summary: 카카오 로그인 시작
      description: "브라우저 페이지 이동으로 호출합니다. 로그인·동의 후 콜백에서 신규 계정을 자동 생성하거나 기존 계정으로 로그인합니다. Swagger Try it out 대신 브라우저에서 여세요."
      security: []
      responses:
        '302': {description: 카카오 로그인 화면으로 이동}
        '503': {description: 서버 카카오 설정 미완료}
  /login/oauth2/code/kakao:
    servers: [{url: /}]
    get:
      tags: [인증]
      summary: 카카오 인증 콜백
      description: "카카오가 호출하는 경로입니다. 인가 코드·state 검증 후 세션을 발급하고 설정된 프론트엔드로 이동합니다. 직접 호출하지 않습니다."
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        '302': {description: 로그인 완료 후 프론트엔드로 이동}
        '401': {description: 인증 실패 또는 유효하지 않은 state}
        '503': {description: 서버 카카오 설정 미완료}
  /auth/csrf:
    get:
      tags: [인증]
      summary: 요청 위조 방지 토큰 조회
      description: "응답 data.token을 쓰기 요청의 X-CSRF-TOKEN 헤더에 넣습니다. 로그인·로그아웃 후 다시 조회하세요. 쿠키는 credentials include로 전송합니다."
      security: []
      responses:
        '200':
          description: CSRF 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [headerName, token]
                    properties:
                      headerName: {type: string, const: X-CSRF-TOKEN}
                      token: {type: string}
  /auth/logout:
    post:
      tags: [인증]
      summary: 서비스 로그아웃
      description: "현재 서비스 세션을 종료합니다. 카카오 계정 전체 로그아웃이나 연결 해제는 수행하지 않습니다."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': {description: 로그아웃 완료}
        '403': {description: CSRF 토큰 누락 또는 불일치}
  /users/me:
    get:
      tags: [사용자]
      summary: 내 계정 조회
      responses:
        '200':
          description: 내부 계정 ID와 가입 시각
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, createdAt]
                    properties:
                      id: {type: string, format: uuid}
                      createdAt: {type: string, format: date-time}
        '401': {description: 로그인 필요}
  /users/me/rooms:
    get:
      tags: [사용자]
      summary: 내가 참여 중인 방 목록 조회
      responses:
        '200':
          description: 계정에 연결된 방 목록 (없으면 빈 배열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [roomId, name, status, memberId, nickname, role]
                      properties:
                        roomId: {type: string, format: uuid}
                        name: {type: string}
                        status: {type: string}
                        memberId: {type: string, format: uuid}
                        nickname: {type: string}
                        role: {type: string, enum: [HOST, MEMBER]}
        '401': {description: 로그인 필요}
  /rooms:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "로그인한 사용자의 모임방 생성 및 방장 등록"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '503': {description: "PAYMENT_NOT_CONFIGURED - 유료 플랜 결제 검증 미연결. 방을 생성하지 않음"}
        '201':
          description: "생성 완료"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoomResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
  /invites/{inviteToken}:
    get:
      tags: [모임방]
      summary: "입장 전 모임방 기본 정보 미리보기"
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: "모임방 미리보기 정보"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /invites/{inviteToken}/join:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "초대 링크로 로그인한 사용자 입장"
      description: "로그인 계정을 방 참가자와 연결합니다. 이미 참여한 계정은 기존 참가 정보를 반환합니다."
      parameters:
        - $ref: '#/components/parameters/InviteToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
      responses:
        '201':
          description: "입장 완료"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRoomResponse'
        '409': {$ref: '#/components/responses/Conflict'}
  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [모임방]
      summary: "현재 참여자 기준 모임방 홈 상태 조회"
      responses:
        '200':
          description: "모임방 홈 정보"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomHomeResponse'
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "모임방 설정 수정 (방장 전용)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 20}
                meetingDate: {type: string, format: date}
                deadlineAt: {type: string, format: date-time}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "모임방과 모든 내용 삭제 (방장 전용)"
      responses:
        '204': {description: "삭제 완료"}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rooms/{roomId}/invite-token/rotate:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "초대 토큰 재발급 (방장 전용)"
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: "새 초대 토큰 원문 (발급 시 한 번만 반환)"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [inviteToken]
                    properties:
                      inviteToken: {type: string}
  /rooms/{roomId}/close:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [모임방]
      summary: "조기 마감 또는 데모 마감 후 두루마리 생성 시작"
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {$ref: '#/components/schemas/CloseMode'}
      responses:
        '202':
          description: "두루마리 생성 작업 접수 완료"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '409': {$ref: '#/components/responses/Conflict'}
  /rooms/{roomId}/photos/upload-requests:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [사진]
      summary: "업로드 대기 사진 등록 및 서명된 업로드 URL 발급"
      description: "Free/Lite/Pro 멤버당 3/6/10장, 방당 24/48/80장. 다른 멤버의 남은 수량을 사용할 수 없으며 업로드 대기 사진도 집계합니다. 방당 한도는 선택 정원과 관계없이 8명 기준입니다."
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: {$ref: '#/components/schemas/UploadFileRequest'}
      responses:
        '201':
          description: "업로드 URL 발급 완료"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRequestsResponse'
        '422': {$ref: '#/components/responses/Unprocessable'}
  /photos/{photoId}/complete:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [사진]
      summary: "저장소에 업로드한 사진의 업로드 완료 확인"
      parameters:
        - $ref: '#/components/parameters/PhotoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '409': {$ref: '#/components/responses/Conflict'}
  /photos/{photoId}:
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [사진]
      summary: "내가 올린 사진과 관련 내용 삭제"
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204': {description: "삭제 완료"}
        '403': {$ref: '#/components/responses/Forbidden'}
  /photos/{photoId}/transcriptions:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [한마디]
      summary: "음성 업로드 및 수정 가능한 받아쓰기 초안 생성"
      description: >-
        첫 한마디는 Free/Lite/Pro 최대 30/60/120초, 덧붙임·되묻기 답변·답가는 20/30/60초입니다.
        최소 길이는 첫 한마디 5초, 나머지 1초입니다. 방 전체 총량은 15/40/90분입니다.
        실제 파일 길이를 측정하며 측정 불가 시 거절합니다. STT 성공 시 차감하며 확정·삭제·만료 시 환급하지 않습니다.
        실패 시 예약량을 해제합니다. 같은 멤버·대상·Idempotency-Key와 동일 음성은 기존 초안을 반환하고 재차감하지 않습니다.
        동일 키로 다른 음성/종류를 보내거나 처리 중인 요청을 반복하면 409입니다. 실패한 요청은 동일 키로 재시도할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PhotoId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: {type: string, format: binary}
                kind:
                  type: string
                  enum: [FIRST, ADDON]
      responses:
        '201':
          description: "받아쓰기 초안"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionDraftResponse'
        '400': {description: '요청 키 누락 또는 음성 길이 측정 불가'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '502': {$ref: '#/components/responses/AiFailure'}
  /photos/{photoId}/entries:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [한마디]
      summary: "첫 한마디 또는 덧붙임 확정"
      parameters:
        - $ref: '#/components/parameters/PhotoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '201':
          description: "한마디 확정 완료"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '422': {$ref: '#/components/responses/Unprocessable'}
  /photos/{photoId}/first-entry/skip:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [한마디]
      summary: "첫 한마디를 나중에 남기고 사진 먼저 공개"
      parameters:
        - $ref: '#/components/parameters/PhotoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '409': {$ref: '#/components/responses/Conflict'}
  /entries/{entryId}:
    patch:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [한마디]
      summary: "내가 작성한 원문 수정"
      parameters:
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript]
              properties:
                transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 최대 3000자. TEXT 첫 한마디 5~300자, 덧붙임 1~200자"}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [한마디]
      summary: "내가 작성한 한마디 삭제"
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204': {description: "삭제 완료"}
  /photos/{photoId}/passes/me:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [돌려보기]
      summary: "이 사진 패스하기"
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [돌려보기]
      summary: "사진 패스 취소"
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204': {description: "삭제 완료"}
  /rooms/{roomId}/circulation:
    get:
      tags: [돌려보기]
      summary: "참여 상태에 따른 내용 잠금을 적용한 돌려보기 카드 조회"
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: cursor
          in: query
          schema: {type: string}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: "돌려보기 목록"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationResponse'
  /rooms/{roomId}/askbacks/me:
    get:
      tags: [되묻기]
      summary: "내가 받은 되묻기 목록 조회"
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AskbackStatus'
      responses:
        '200':
          description: "되묻기 목록"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AskbackListResponse'}
  /askbacks/{askbackId}:
    get:
      tags: [되묻기]
      summary: "되묻기 상세 조회 (질문을 받은 참여자 전용)"
      parameters:
        - $ref: '#/components/parameters/AskbackId'
      responses:
        '200':
          description: "되묻기 상세 정보"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AskbackDetailResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /askbacks/{askbackId}/answer:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [되묻기]
      summary: "되묻기 답변을 원문으로 확정"
      parameters:
        - $ref: '#/components/parameters/AskbackId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskbackAnswerRequest'
      responses:
        '201':
          description: "답변 확정 완료"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AskbackAnswerResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /askbacks/{askbackId}/forgot:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [되묻기]
      summary: "되묻기에 '기억 안 나요'로 응답"
      parameters:
        - $ref: '#/components/parameters/AskbackId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /askbacks/{askbackId}/postpone:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [되묻기]
      summary: "되묻기를 미응답 상태로 유지하고 나중으로 미루기"
      parameters:
        - $ref: '#/components/parameters/AskbackId'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /askbacks/{askbackId}/transcriptions:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [되묻기]
      summary: "되묻기 답변용 음성 받아쓰기 초안 생성"
      description: >-
        첫 한마디는 Free/Lite/Pro 최대 30/60/120초, 덧붙임·되묻기 답변·답가는 20/30/60초입니다.
        최소 길이는 첫 한마디 5초, 나머지 1초입니다. 방 전체 총량은 15/40/90분입니다.
        실제 파일 길이를 측정하며 측정 불가 시 거절합니다. STT 성공 시 차감하며 확정·삭제·만료 시 환급하지 않습니다.
        실패 시 예약량을 해제합니다. 같은 멤버·대상·Idempotency-Key와 동일 음성은 기존 초안을 반환하고 재차감하지 않습니다.
        동일 키로 다른 음성/종류를 보내거나 처리 중인 요청을 반복하면 409입니다. 실패한 요청은 동일 키로 재시도할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AskbackId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: "받아쓰기 초안"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranscriptionDraftResponse'}
        '400': {description: '요청 키 누락 또는 음성 길이 측정 불가'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '502': {$ref: '#/components/responses/AiFailure'}
  /rooms/{roomId}/askbacks/run:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [되묻기]
      summary: "데모 모드에서 되묻기 분석 즉시 실행 (방장 전용)"
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: "분석 작업 접수 완료"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAcceptedResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /rooms/{roomId}/scroll:
    get:
      tags: [두루마리]
      summary: "현재 두루마리와 문단 조회"
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: "두루마리"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollResponse'
        '409': {$ref: '#/components/responses/Conflict'}
  /rooms/{roomId}/weave-jobs:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [두루마리]
      summary: "실패한 두루마리 생성 다시 시도 (방장 전용)"
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: "작업 접수 완료"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAcceptedResponse'}
  /jobs/{jobId}:
    get:
      tags: [두루마리]
      summary: "AI 작업 진행 상태 조회"
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: "작업 정보"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobResponse'}
  /paragraphs/{paragraphId}/replies:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "답가 등록 및 해당 문단 다시 엮기 요청"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplyRequest'
      responses:
        '202':
          description: "답가 접수 완료"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAcceptedResponse'}
  /paragraphs/{paragraphId}/transcriptions:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "답가용 음성 받아쓰기 초안 생성"
      description: >-
        첫 한마디는 Free/Lite/Pro 최대 30/60/120초, 덧붙임·되묻기 답변·답가는 20/30/60초입니다.
        최소 길이는 첫 한마디 5초, 나머지 1초입니다. 방 전체 총량은 15/40/90분입니다.
        실제 파일 길이를 측정하며 측정 불가 시 거절합니다. STT 성공 시 차감하며 확정·삭제·만료 시 환급하지 않습니다.
        실패 시 예약량을 해제합니다. 같은 멤버·대상·Idempotency-Key와 동일 음성은 기존 초안을 반환하고 재차감하지 않습니다.
        동일 키로 다른 음성/종류를 보내거나 처리 중인 요청을 반복하면 409입니다. 실패한 요청은 동일 키로 재시도할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ParagraphId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: "받아쓰기 초안"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranscriptionDraftResponse'}
        '400': {description: '요청 키 누락 또는 음성 길이 측정 불가'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '502': {$ref: '#/components/responses/AiFailure'}
  /replies/{replyId}:
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "내 답가 삭제 및 문단 복구 또는 다시 엮기"
      parameters:
        - name: replyId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '202':
          description: "문단 복구 작업 접수 완료"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAcceptedResponse'}
  /paragraphs/{paragraphId}/fidelity-rating:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "원문 충실도 평가 등록 또는 수정"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: {type: integer, minimum: 1, maximum: 5}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /paragraphs/{paragraphId}/reactions/ah-matda:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "'아 맞다' 반응 추가"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [답가]
      summary: "'아 맞다' 반응 취소"
      parameters:
        - $ref: '#/components/parameters/ParagraphId'
      responses:
        '204': {description: "삭제 완료"}
  /rooms/{roomId}/notifications:
    get:
      tags: [알림]
      summary: "내 알림 목록 조회"
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: "알림 목록"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Notification'}
  /notifications/{notificationId}/read:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [알림]
      summary: "알림 읽음 처리"
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /rooms/{roomId}/events:
    get:
      tags: [알림]
      summary: "실시간 알림 수신 (SSE 연결을 사용할 수 없으면 5초 간격으로 조회)"
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: streamToken
          in: query
          required: true
          description: "특정 모임방과 참여자에게 연결된 일회용 토큰 (유효 시간 60초)"
          schema: {type: string}
      responses:
        '200':
          description: "실시간 알림 이벤트 스트림 (SSE)"
          content:
            text/event-stream:
              schema: {type: string}
  /rooms/{roomId}/event-token:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [알림]
      summary: "실시간 알림 연결용 단기 일회용 토큰 발급"
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '201':
          description: "실시간 알림 연결용 토큰"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [eventsUrl, expiresAt]
                    properties:
                      eventsUrl: {type: string, format: uri}
                      expiresAt: {type: string, format: date-time}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: "카카오 로그인 후 브라우저가 관리하는 HttpOnly 세션 쿠키. 참가자 Bearer 토큰은 사용하지 않습니다."
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: "GET /api/v1/auth/csrf에서 받은 token. POST/PUT/PATCH/DELETE 요청에 필요하며 로그인 후 다시 조회합니다."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    InviteToken:
      name: inviteToken
      in: path
      required: true
      schema: {type: string, minLength: 22}
    RoomId:
      name: roomId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    EntryId:
      name: entryId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ParagraphId:
      name: paragraphId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    AskbackId:
      name: askbackId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
  responses:
    Ok:
      description: "요청 처리 성공"
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {type: object}
    BadRequest:
      description: "잘못된 요청"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: "접근 권한 없음"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: "요청한 대상을 찾을 수 없음"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: "현재 상태 또는 기존 데이터와 충돌"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unprocessable:
      description: "입력값 검증 실패 또는 기능별 제한 초과"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AiFailure:
      description: "AI 서비스 호출 또는 검증 실패"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Id:
      type: string
      minLength: 16
      maxLength: 40
      examples: [01JABCD1234EFGH5678]
    RoomStatus:
      type: string
      enum: [COLLECTING, CIRCULATING, WEAVING, GROWING]
    CloseMode:
      type: string
      enum: [EARLY, DEMO]
    FlowerCode:
      type: string
      enum: [AZALEA, FORSYTHIA, ROYAL_AZALEA, CANOLA, LILAC, FORGET_ME_NOT, TEAL, PURPLE]
    Consent:
      type: object
      required: [version, terms, mediaProcessing, externalAiProcessing]
      properties:
        version: {type: string}
        terms: {type: boolean, const: true}
        mediaProcessing: {type: boolean, const: true}
        externalAiProcessing: {type: boolean, const: true}
    Member:
      type: object
      required: [id, nickname, role, flowerCode]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        nickname: {type: string, minLength: 1, maxLength: 10}
        role: {type: string, enum: [HOST, MEMBER]}
        flowerCode: {$ref: '#/components/schemas/FlowerCode'}
        photoCount: {type: integer, minimum: 0, maximum: 10}
        storyCount: {type: integer, minimum: 0}
        responseRate: {type: number, minimum: 0, maximum: 1}
    RoomPlan:
      type: string
      enum: [FREE, LITE, PRO]
      description: "방별 플랜. 계정 전체에 적용되지 않습니다."
    RoomQuota:
      type: object
      description: "사진은 현재 보유량(업로드 대기 포함), 음성은 STT 성공 누적량. 재엮기는 수동 요청과 답가 반영 시도를 합산합니다. 최초 생성은 제외합니다."
      properties:
        photosPerMember: {type: integer, minimum: 0, description: "멤버당 사진 한도 3/6/10"}
        photosPerRoom: {type: integer, minimum: 0, description: "방당 사진 한도 24/48/80"}
        photoCount: {type: integer, minimum: 0, description: "방 전체 사진 수"}
        myPhotoCount: {type: integer, minimum: 0, description: "현재 멤버 사진 수"}
        photosRemaining: {type: integer, minimum: 0, description: "방 전체 남은 사진 수"}
        myPhotosRemaining: {type: integer, minimum: 0, description: "현재 멤버의 남은 사진 수"}
        firstMaxSeconds: {type: integer, minimum: 0, description: "첫 한마디 최대 초 30/60/120"}
        otherMaxSeconds: {type: integer, minimum: 0, description: "덧붙임·되묻기 답변·답가 최대 초 20/30/60"}
        voiceLimitMs: {type: integer, minimum: 0, description: "방 전체 음성 한도 밀리초"}
        voiceUsedMs: {type: integer, minimum: 0, description: "STT 성공 누적 밀리초"}
        voiceReservedMs: {type: integer, minimum: 0, description: "현재 STT 처리 중인 밀리초"}
        voiceRemainingMs: {type: integer, minimum: 0, description: "사용량과 예약량을 뺀 남은 밀리초"}
        regenerationLimit: {type: integer, minimum: 0, description: "재엮기 한도 3/6/12"}
        regenerationCount: {type: integer, minimum: 0, description: "사용한 재엮기 횟수"}
        regenerationsRemaining: {type: integer, minimum: 0, description: "남은 재엮기 횟수"}
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name, meetingDate, hostNickname, consent, planType]
      description: "플랜 선택 필수. FREE는 즉시 생성. LITE/PRO는 결제 검증 미연결 상태에서 503 PAYMENT_NOT_CONFIGURED를 반환하며 방을 생성하지 않습니다."
      properties:
        planType: {$ref: '#/components/schemas/RoomPlan'}
        capacity: {type: integer, minimum: 1, maximum: 8, default: 8, description: "방장 포함 정원. 생략 시 8명"}
        name: {type: string, minLength: 1, maxLength: 20}
        meetingDate: {type: string, format: date}
        hostNickname: {type: string, minLength: 1, maxLength: 10}
        consent: {$ref: '#/components/schemas/Consent'}
    CreateRoomResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [room, member, inviteToken]
          properties:
            room: {$ref: '#/components/schemas/RoomSummary'}
            member: {$ref: '#/components/schemas/Member'}
            inviteToken: {type: string}
    RoomSummary:
      type: object
      required: [id, name, status, deadlineAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        capacity: {type: integer, minimum: 1, maximum: 8}
        planType: {$ref: '#/components/schemas/RoomPlan'}
        quota:
          allOf: [{$ref: '#/components/schemas/RoomQuota'}]
          description: "방 홈 조회에 포함. 생성/입장 응답에는 포함하지 않습니다."
        name: {type: string}
        meetingDate: {type: string, format: date}
        status: {$ref: '#/components/schemas/RoomStatus'}
        deadlineAt: {type: string, format: date-time}
    InvitePreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [roomName, status, memberCount, capacity, flowers, canJoin]
          properties:
            roomName: {type: string}
            meetingDate: {type: string, format: date}
            status: {$ref: '#/components/schemas/RoomStatus'}
            memberCount: {type: integer, minimum: 0, maximum: 8}
            capacity: {type: integer, minimum: 1, maximum: 8, description: "방장 포함 선택 정원"}
            flowers:
              type: array
              items: {$ref: '#/components/schemas/FlowerCode'}
            canJoin: {type: boolean}
    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [nickname, consent]
      properties:
        nickname: {type: string, minLength: 1, maxLength: 10}
        consent: {$ref: '#/components/schemas/Consent'}
    JoinRoomResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [room, member]
          properties:
            room: {$ref: '#/components/schemas/RoomSummary'}
            member: {$ref: '#/components/schemas/Member'}
    RoomHomeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [room, me, members, todayFlowers, myTodo, unreadCount, allCompleted]
          properties:
            room: {$ref: '#/components/schemas/RoomSummary'}
            me: {$ref: '#/components/schemas/Member'}
            members:
              type: array
              items: {$ref: '#/components/schemas/Member'}
            todayFlowers:
              type: array
              items:
                type: object
                required: [memberId, flowerCode, entryKind]
                properties:
                  memberId: {$ref: '#/components/schemas/Id'}
                  flowerCode: {$ref: '#/components/schemas/FlowerCode'}
                  entryKind: {type: string, enum: [FIRST, ADDON]}
            myTodo:
              type: object
              required: [needsFirstEntry, pendingCirculationCount, topAskback]
              properties:
                needsFirstEntry: {type: boolean}
                pendingCirculationCount: {type: integer, minimum: 0}
                topAskback:
                  anyOf:
                    - type: object
                      required: [id, question]
                      properties:
                        id: {$ref: '#/components/schemas/Id'}
                        question: {type: string, maxLength: 60}
                    - type: 'null'
            unreadCount: {type: integer, minimum: 0}
            allCompleted: {type: boolean}
    UploadFileRequest:
      type: object
      additionalProperties: false
      required: [clientFileId, fileName, contentType, sizeBytes, displayOrder]
      properties:
        clientFileId: {type: string, maxLength: 64}
        fileName: {type: string, maxLength: 255}
        contentType: {type: string, enum: [image/jpeg, image/png, image/heic, image/heif]}
        sizeBytes: {type: integer, minimum: 1, maximum: 2000000}
        displayOrder: {type: integer, minimum: 1, maximum: 10, description: "Free 1~3 / Lite 1~6 / Pro 1~10"}
    UploadRequestsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uploads]
          properties:
            uploads:
              type: array
              items:
                type: object
                required: [clientFileId, photoId, uploadUrl, expiresAt]
                properties:
                  clientFileId: {type: string}
                  photoId: {$ref: '#/components/schemas/Id'}
                  uploadUrl: {type: string, format: uri}
                  expiresAt: {type: string, format: date-time}
                  requiredHeaders: {type: object, additionalProperties: {type: string}}
    TranscriptionDraftResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transcriptionId, audioAssetId, transcript, expiresAt]
          properties:
            transcriptionId: {$ref: '#/components/schemas/Id'}
            audioAssetId: {$ref: '#/components/schemas/Id'}
            transcript: {type: string}
            detectedLanguages: {type: array, items: {type: string}}
            expiresAt: {type: string, format: date-time}
    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [kind, inputMode, transcript]
      properties:
        kind: {type: string, enum: [FIRST, ADDON]}
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcriptionId: {$ref: '#/components/schemas/Id'}
        transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 최대 3000자. TEXT 첫 한마디 5~300자, 덧붙임 1~200자"}
      allOf:
        - if:
            properties: {inputMode: {const: VOICE}}
          then:
            required: [transcriptionId]
    Entry:
      type: object
      required: [id, photoId, member, kind, inputMode, transcript, confirmedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        photoId: {$ref: '#/components/schemas/Id'}
        member: {$ref: '#/components/schemas/Member'}
        kind: {type: string, enum: [FIRST, ADDON, ASKBACK_ANSWER]}
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcript: {type: string}
        audioUrl: {type: [string, 'null'], format: uri}
        confirmedAt: {type: string, format: date-time}
    EntryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [entry]
          properties:
            entry: {$ref: '#/components/schemas/Entry'}
            askbackJobId:
              anyOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
    CirculationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [cards]
          properties:
            cards:
              type: array
              items:
                type: object
                required: [photo, firstEntry, myResponse, locked, otherEntries]
                properties:
                  photo: {$ref: '#/components/schemas/Photo'}
                  firstEntry:
                    anyOf:
                      - $ref: '#/components/schemas/Entry'
                      - type: 'null'
                  myResponse:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [NONE, ADDON, PASSED, OWN_PHOTO]}
                  locked: {type: boolean}
                  lockReason: {type: [string, 'null'], enum: [RESPOND_FIRST, null]}
                  otherEntries:
                    type: array
                    items: {$ref: '#/components/schemas/Entry'}
            nextCursor: {type: [string, 'null']}
    Photo:
      type: object
      required: [id, imageUrl, uploader, displayOrder]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        imageUrl: {type: string, format: uri}
        uploader: {$ref: '#/components/schemas/Member'}
        displayOrder: {type: integer}
    Askback:
      type: object
      required: [id, photo, gapType, question, evidenceNicknames, status, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        photo: {$ref: '#/components/schemas/Photo'}
        gapType: {type: string, enum: [CONFLICT, MISSING_REASON, NO_ADDON, MISSING_CONTEXT]}
        question: {type: string, maxLength: 60}
        evidenceNicknames:
          type: array
          items: {type: string, minLength: 1, maxLength: 10}
        status: {$ref: '#/components/schemas/AskbackStatus'}
        firstEntry:
          anyOf:
            - $ref: '#/components/schemas/Entry'
            - type: 'null'
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    AskbackStatus:
      type: string
      enum: [PENDING, ANSWERED, FORGOT, EXPIRED, CANCELLED]
    AskbackListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [askbacks]
          properties:
            askbacks:
              type: array
              items: {$ref: '#/components/schemas/Askback'}
    AskbackDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [askback]
          properties:
            askback: {$ref: '#/components/schemas/Askback'}
    AskbackAnswerRequest:
      type: object
      additionalProperties: false
      required: [inputMode, transcript]
      properties:
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcriptionId: {$ref: '#/components/schemas/Id'}
        transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 1~3000자, TEXT 1~200자"}
      allOf:
        - if:
            properties: {inputMode: {const: VOICE}}
          then:
            required: [transcriptionId]
    AskbackAnswerResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [askback, entry]
          properties:
            askback:
              type: object
              required: [id, status]
              properties:
                id: {$ref: '#/components/schemas/Id'}
                status: {type: string, const: ANSWERED}
            entry: {$ref: '#/components/schemas/Entry'}
    ScrollResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, version, participantCount, memberCount, paragraphs]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            version: {type: integer, minimum: 1}
            participantCount: {type: integer}
            memberCount: {type: integer}
            generatedAt: {type: string, format: date-time}
            paragraphs:
              type: array
              items: {$ref: '#/components/schemas/Paragraph'}
    Paragraph:
      type: object
      required: [id, photo, body, version, sources, replyCount, ahMatdaCount, aiGenerated]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        photo: {$ref: '#/components/schemas/Photo'}
        body: {type: string}
        version: {type: integer, minimum: 1}
        sources:
          type: array
          items:
            type: object
            required: [entryId, member, quote]
            properties:
              entryId: {$ref: '#/components/schemas/Id'}
              member: {$ref: '#/components/schemas/Member'}
              quote: {type: string}
        replyCount: {type: integer, minimum: 0}
        ahMatdaCount: {type: integer, minimum: 0}
        aiGenerated: {type: boolean, const: true}
    CreateReplyRequest:
      type: object
      additionalProperties: false
      required: [inputMode, transcript]
      properties:
        inputMode: {type: string, enum: [VOICE, TEXT]}
        transcriptionId: {$ref: '#/components/schemas/Id'}
        transcript: {type: string, minLength: 1, maxLength: 3000, description: "VOICE 1~3000자, TEXT 1~200자"}
    JobAcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [job]
          properties:
            job: {$ref: '#/components/schemas/Job'}
    JobResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Job'}
    Job:
      type: object
      required: [id, type, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type: {type: string, enum: [ASKBACK_ANALYZE, WEAVE_SCROLL, REPLY_REWEAVE, MEDIA_DELETE]}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        progress:
          type: object
          properties:
            completed: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
        errorCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, resourceType, resourceId, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type: {type: string, enum: [ASKBACK_RECEIVED, SCROLL_READY, REPLY_APPLIED]}
        resourceType: {type: string}
        resourceId: {$ref: '#/components/schemas/Id'}
        readAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            requestId: {type: string}
